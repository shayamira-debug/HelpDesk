<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>קריאות השירות שלי</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}
.wrap{max-width:900px;margin:30px auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}
input,select,textarea,button{font:inherit;padding:10px 11px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
button{cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.logout{background:#fff}
button:disabled{opacity:.6;cursor:not-allowed}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}
.notice{display:none;padding:11px;border-radius:8px;margin-bottom:12px}.ok{background:#ecfdf5;color:#166534}.error{background:#fef2f2;color:#991b1b}
.muted{color:#6b7280;font-size:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:10px}.top{align-items:flex-start}}

.app-brand{display:flex;align-items:center;gap:16px;margin-bottom:20px;background:#fff;padding:14px 18px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.app-brand img{width:240px;max-width:45vw;height:auto}
.app-brand .brand-text{margin-right:auto}
.status-pill{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}
.status-new{background:#dbeafe;color:#1d4ed8}
.status-open{background:#ffedd5;color:#c2410c}
.status-waiting{background:#ede9fe;color:#6d28d9}
.status-closed{background:#dcfce7;color:#166534}


.version-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-right:8px;
  padding:3px 8px;
  border-radius:999px;
  background:#eef2ff;
  color:#4338ca;
  border:1px solid #c7d2fe;
  font-size:12px;
  font-weight:700;
  vertical-align:middle;
  white-space:nowrap;
}

.version-fixed{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 10px;
  border-radius:999px;
  background:#111827;
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.2px;
  margin-inline-start:10px;
  white-space:nowrap;
}



.header-version-badge{
  display:inline-flex;
  align-items:center;
  margin-inline-start:8px;
  padding:4px 9px;
  border-radius:999px;
  background:#111827;
  color:#fff;
  font-size:12px;
  font-weight:800;
  vertical-align:middle;
  white-space:nowrap;
}

/* V1.6.6 - matching status palette */
.status-new{
  background:#dbeafe !important;
  color:#1d4ed8 !important;
}
.status-open{
  background:#bbf7d0 !important;
  color:#14532d !important;
}
.status-waiting{
  background:#ede9fe !important;
  color:#6d28d9 !important;
}
.status-closed{
  background:#fee2e2 !important;
  color:#b91c1c !important;
}

</style>
</head>
<body>
<div class="wrap">
  <div class="app-brand">
    <img src="chamber-logo.png" alt="איגוד לשכות המסחר">
    <div class="brand-text"><strong>מערכת קריאות אחזקה</strong><div class="muted">איגוד לשכות המסחר</div></div>
  </div>
  <div class="top">
    <div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h1>קריאות השירות שלי</h1><span class="header-version-badge">V1.6.6</span></div>
      <div id="who" class="muted"></div><div id="portal-live-status" class="muted" style="margin-top:4px">מתחבר לעדכון חי...</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="soundToggleBtn" class="logout" type="button">🔕 הפעל צליל</button><button id="logoutBtn" class="logout" type="button">התנתקות</button></div>
  </div>

  <div id="notice" class="notice"></div>

  <div class="card">
    <h2>פתיחת קריאה חדשה</h2>
    <form id="form">
      <div class="grid">
        <div class="field">
          <label>שם מלא</label>
          <input id="name" required>
        </div>
        <div class="field">
          <label>קטגוריה</label>
          <select id="category" required>
            <option value="">בחר</option>
            <option>מזגן</option><option>חשמל</option><option>תאורה</option>
            <option>ריהוט</option><option>ניקיון</option><option>אינסטלציה</option><option>אחר</option>
          </select>
        </div>
        <div class="field">
          <label>מיקום</label>
          <input id="location">
        </div>
        <div class="field">
          <label>דחיפות</label>
          <select id="priority">
            <option>רגילה</option><option>גבוהה</option><option>דחופה</option>
          </select>
        </div>
        <div class="field full">
          <label>תיאור הקריאה</label>
          <input id="subject" required>
        </div>
      </div>
      <div style="margin-top:14px">
        <button id="submitBtn" class="primary" type="submit">שליחת קריאה</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>הקריאות שלי</h2>
    <table>
      <thead><tr><th>מס'</th><th>נושא</th><th>קטגוריה</th><th>דחיפות</th><th>סטטוס</th></tr></thead>
      <tbody id="tbody">
        <tr><td colspan="5" class="muted" style="text-align:center">טוען...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const SUPABASE_URL = "https://jzerktuuprgmotckfraw.supabase.co";
const SUPABASE_KEY = "sb_publishable_PhMZY9SXqfENVjtn1Ya9vA_4NmJyE3b";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;

function showNotice(text,type="ok"){
  const e=document.getElementById("notice");
  e.textContent=text;
  e.className="notice "+type;
  e.style.display="block";
  setTimeout(()=>e.style.display="none",3500);
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

function statusClass(status){
  return {
    "חדשה":"status-new",
    "בטיפול":"status-open",
    "ממתין":"status-waiting",
    "סגורה":"status-closed"
  }[status] || "status-new";
}



let audioCtx = null;
  let soundEnabled = localStorage.getItem("helpdesk_sound_enabled") === "1";

  function ensureAudioContext(){
    if(!audioCtx){
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if(AudioContext) audioCtx = new AudioContext();
    }
    if(audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume().catch(()=>{});
    }
  }

  function playTone(kind){
    if(!soundEnabled) return;
    ensureAudioContext();
    if(!audioCtx) return;

    const now = audioCtx.currentTime;

    if(kind === "new"){
      // Two-note alert for a new ticket.
      [880, 1175].forEach((freq, i)=>{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + i*0.16);
        gain.gain.exponentialRampToValueAtTime(0.18, now + i*0.16 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.16 + 0.14);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i*0.16);
        osc.stop(now + i*0.16 + 0.16);
      });
    }else{
      // Short softer tone for status changes.
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 660;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }
  }

  function showLiveToast(text){
    let toast = document.getElementById("liveToast");
    if(!toast){
      toast = document.createElement("div");
      toast.id = "liveToast";
      toast.style.cssText = `
        position:fixed; left:20px; bottom:20px; z-index:9999;
        background:#1f2937; color:#fff; padding:12px 16px;
        border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.22);
        font-size:14px; opacity:0; transform:translateY(10px);
        transition:.2s ease; max-width:min(360px,calc(100vw - 40px));
      `;
      document.body.appendChild(toast);
    }
    toast.textContent = text;
    toast.style.opacity = "1";
    toast.style.transform = "translateY(0)";
    clearTimeout(window.__helpdeskToastTimer);
    window.__helpdeskToastTimer = setTimeout(()=>{
      toast.style.opacity = "0";
      toast.style.transform = "translateY(10px)";
    },3500);
  }

  function updateSoundButton(){
    const btn = document.getElementById("soundToggleBtn");
    if(!btn) return;
    btn.textContent = soundEnabled ? "🔔 צליל פעיל" : "🔕 הפעל צליל";
    btn.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
  }

  function toggleSound(){
    soundEnabled = !soundEnabled;
    localStorage.setItem("helpdesk_sound_enabled", soundEnabled ? "1" : "0");
    if(soundEnabled){
      ensureAudioContext();
      playTone("status"); // confirmation sound after user gesture
      showLiveToast("התראות קוליות הופעלו");
    }else{
      showLiveToast("התראות קוליות כובו");
    }
    updateSoundButton();
  }

let myTicketsRealtimeChannel = null;

async function startMyTicketsRealtime(){
  if(!currentUser) return;

  const {data:{session}} = await sb.auth.getSession();
  if(!session?.access_token) return;

  // Explicitly authenticate the Realtime socket with the current JWT.
  sb.realtime.setAuth(session.access_token);

  if(myTicketsRealtimeChannel){
    await sb.removeChannel(myTicketsRealtimeChannel);
    myTicketsRealtimeChannel = null;
  }

  myTicketsRealtimeChannel = sb
    .channel("my-tickets-live-" + currentUser.id)
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"maintenance_tickets",
        filter:"requester_user_id=eq." + currentUser.id
      },
      async (payload)=>{
        console.log("Realtime ticket event:", payload);

        if(payload.eventType === "INSERT"){
          // The employee already sees an immediate success message on his own submit,
          // so avoid a duplicate sound for the same action.
        }

        if(payload.eventType === "UPDATE"){
          const oldStatus = payload.old?.status;
          const newStatus = payload.new?.status;
          if(oldStatus && newStatus && oldStatus !== newStatus){
            playTone("status");
            const n = payload.new?.ticket_number ? " #" + payload.new.ticket_number : "";
            showLiveToast("סטטוס קריאה" + n + " השתנה: " + oldStatus + " → " + newStatus);
          }
        }

        await loadTickets();
      }
    )
    .subscribe((status)=>{
      console.log("Realtime status:", status);
      const el=document.getElementById("portal-live-status");
      if(!el) return;

      if(status==="SUBSCRIBED"){
        el.textContent="● עדכון חי מחובר";
        el.style.color="#166534";
      }else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT"){
        el.textContent="● חיבור חי לא זמין";
        el.style.color="#b45309";
      }else{
        el.textContent="● מתחבר לעדכון חי...";
        el.style.color="#6b7280";
      }
    });
}

// Slow fallback in case a websocket event is missed.
setInterval(()=>{
  if(currentUser) loadTickets();
},300000);

async function init(){
  const {data:{session},error}=await sb.auth.getSession();

  if(error){
    console.error("getSession",error);
    showNotice("שגיאה בבדיקת ההתחברות: "+error.message,"error");
    return;
  }

  if(!session?.user){
    location.replace("./index.html");
    return;
  }

  currentUser=session.user;
  document.getElementById("who").textContent=currentUser.email || "";

  await loadTickets();
  await startMyTicketsRealtime();
}

async function loadTickets(){
  if(!currentUser) return;

  const {data,error}=await sb
    .from("maintenance_tickets")
    .select("id,ticket_number,subject,category,priority,status,created_at")
    .eq("requester_user_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    console.error("loadTickets",error);
    showNotice("שגיאה בטעינת הקריאות: "+error.message,"error");
    document.getElementById("tbody").innerHTML =
      '<tr><td colspan="5" style="text-align:center;color:#991b1b">שגיאה בטעינת הקריאות</td></tr>';
    return;
  }

  const rows=data||[];
  document.getElementById("tbody").innerHTML = rows.length
    ? rows.map(t=>`<tr>
        <td>${t.ticket_number??""}</td>
        <td>${esc(t.subject)}</td>
        <td>${esc(t.category)}</td>
        <td>${esc(t.priority)}</td>
        <td><span class="status-pill ${statusClass(t.status)}">${esc(t.status)}</span></td>
      </tr>`).join("")
    : '<tr><td colspan="5" style="text-align:center;color:#6b7280">אין עדיין קריאות להצגה</td></tr>';
}

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();

  if(!currentUser){
    showNotice("המשתמש אינו מחובר.","error");
    return;
  }

  const submitBtn=document.getElementById("submitBtn");
  submitBtn.disabled=true;
  submitBtn.textContent="שולח...";

  const row={
    requester_user_id:currentUser.id,
    requester_name:document.getElementById("name").value.trim(),
    requester_email:currentUser.email,
    category:document.getElementById("category").value,
    location:document.getElementById("location").value.trim()||null,
    priority:document.getElementById("priority").value,
    subject:document.getElementById("subject").value.trim(),
    description:document.getElementById("subject").value.trim(),
    status:"חדשה"
  };

  const {data,error}=await sb
    .from("maintenance_tickets")
    .insert(row)
    .select("id,ticket_number,requester_user_id")
    .single();

  submitBtn.disabled=false;
  submitBtn.textContent="שליחת קריאה";

  if(error){
    console.error("insert ticket",error);
    showNotice("שמירת הקריאה נכשלה: "+error.message+(error.details?" | "+error.details:""),"error");
    return;
  }

  if(data.requester_user_id!==currentUser.id){
    console.error("requester mismatch",data,currentUser.id);
    showNotice("הקריאה נשמרה אך לא קושרה למשתמש.","error");
    return;
  }

  const {error:historyError}=await sb
    .from("maintenance_ticket_history")
    .insert({
      ticket_id:data.id,
      action_type:"פתיחת קריאה",
      new_value:"חדשה",
      note:"הקריאה נפתחה על ידי העובד"
    });

  if(historyError) console.error("history insert",historyError);

  e.target.reset();
  showNotice("קריאה #"+data.ticket_number+" נפתחה בהצלחה");
  await loadTickets();
});

document.getElementById("soundToggleBtn").addEventListener("click",toggleSound);
updateSoundButton();

document.getElementById("logoutBtn").addEventListener("click",async()=>{
  const btn=document.getElementById("logoutBtn");
  btn.disabled=true;
  btn.textContent="מתנתק...";
  try{
    await sb.auth.signOut();
  }catch(e){
    console.error(e);
  }finally{
    location.replace("./index.html");
  }
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(console.error));
}


init();
</script>
</body>
</html>
