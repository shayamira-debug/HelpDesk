<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>מערכת קריאות אחזקה</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(430px,100%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 36px rgba(0,0,0,.10)}
.brand{font-size:13px;color:#6b7280;margin-bottom:8px}h1{margin:0 0 8px;font-size:28px}.sub{color:#6b7280;margin-bottom:24px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}label{font-weight:700;font-size:14px}
input,button{font:inherit;padding:12px 13px;border:1px solid #d1d5db;border-radius:10px}
button{cursor:pointer}.primary{width:100%;background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700}.primary:disabled{opacity:.6}
.notice{display:none;padding:12px;border-radius:9px;margin-bottom:14px;line-height:1.45}.error{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#166534}
.small{font-size:12px;color:#6b7280;margin-top:14px;line-height:1.6}.status{font-size:13px;color:#6b7280;margin-top:10px;text-align:center}

.org-logo-wrap{display:flex;justify-content:center;margin-bottom:18px}
.org-logo{max-width:290px;width:78%;height:auto;object-fit:contain}


.version-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-right:8px;
  padding:3px 8px;
  border-radius:999px;
  background:#eef2ff;
  color:#4338ca;
  border:1px solid #c7d2fe;
  font-size:12px;
  font-weight:700;
  vertical-align:middle;
  white-space:nowrap;
}

.version-fixed{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 10px;
  border-radius:999px;
  background:#111827;
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.2px;
  margin-inline-start:10px;
  white-space:nowrap;
}

</style>
</head>
<body>
<div class="wrap"><div class="card">

<div class="org-logo-wrap">
  <img src="chamber-logo.png" class="org-logo" alt="איגוד לשכות המסחר">
</div>
<div class="brand">מערכת קריאות שירות</div>
<h1>אחזקה</h1>
<div class="sub">כניסה לעובדים ולצוות האחזקה</div>
<div id="notice" class="notice"></div>
<div class="field"><label for="email">אימייל</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label for="password">סיסמה</label><input id="password" type="password" autocomplete="current-password"></div>
<button id="loginBtn" class="primary" type="button">כניסה</button>
<div id="status" class="status"></div>
<div class="small">לאחר ההתחברות המערכת מנתבת אוטומטית לעמוד העובד או למסך הניהול בהתאם להרשאות.</div>
</div></div>
<script>
const SUPABASE_URL="https://jzerktuuprgmotckfraw.supabase.co";
const SUPABASE_KEY="sb_publishable_PhMZY9SXqfENVjtn1Ya9vA_4NmJyE3b";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const btn=document.getElementById("loginBtn");
btn.addEventListener("click",login);
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
function notice(text,type="error"){const el=document.getElementById("notice");el.textContent=text;el.className="notice "+type;el.style.display="block";}
function setStatus(text=""){document.getElementById("status").textContent=text;}
async function routeUser(user){
 setStatus("בודק הרשאות...");
 const {data:team,error}=await sb.from("maintenance_users").select("role,is_active").eq("auth_user_id",user.id).maybeSingle();
 if(error){console.error(error);notice("ההתחברות הצליחה, אך בדיקת ההרשאות נכשלה: "+error.message);setStatus("");return;}
 if(team && team.is_active && ["manager","technician"].includes(team.role)){
   location.href="admin.html";
 }else{
   // employee (דייר) and chamber (לשכה) open service requests in the user portal.
   location.href="portal.html";
 }
}
async function login(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 document.getElementById("notice").style.display="none";
 if(!email||!password){notice("יש להזין אימייל וסיסמה.");return;}
 btn.disabled=true;btn.textContent="מתחבר...";setStatus("מתחבר ל-Supabase...");
 try{
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){notice("לא ניתן להתחבר: "+error.message);return;}
  if(!data?.user){notice("לא התקבל משתמש לאחר ההתחברות.");return;}
  await routeUser(data.user);
 }catch(err){console.error(err);notice("אירעה שגיאה בחיבור. פתח את המערכת דרך GitHub Pages ובדוק שיש חיבור לאינטרנט.");}
 finally{btn.disabled=false;btn.textContent="כניסה";setStatus("");}
}
async function checkExistingSession(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session?.user){
      showExistingSession(session.user);
    }
  }catch(e){
    console.error(e);
  }
}

function showExistingSession(user){
  const email = user?.email || "משתמש מחובר";
  const card = document.querySelector(".card");

  // Hide login fields/button while a valid session exists
  document.querySelectorAll(".field").forEach(el=>el.style.display="none");
  document.getElementById("loginBtn").style.display="none";
  setStatus("");

  let panel=document.getElementById("existingSessionPanel");
  if(!panel){
    panel=document.createElement("div");
    panel.id="existingSessionPanel";
    panel.innerHTML=`
      <div style="background:#eff6ff;color:#1d4ed8;padding:14px;border-radius:10px;margin-bottom:14px">
        אתה כבר מחובר כ־<strong id="existingSessionEmail"></strong>
      </div>
      <button id="continueBtn" class="primary" type="button">המשך למערכת</button>
      <button id="sessionLogoutBtn" type="button" style="width:100%;margin-top:8px;background:#fff">התנתקות</button>
    `;
    card.insertBefore(panel, document.querySelector(".small"));
    document.getElementById("continueBtn").addEventListener("click", async ()=>{
      const {data:{session}}=await sb.auth.getSession();
      if(session?.user) await routeUser(session.user);
    });
    document.getElementById("sessionLogoutBtn").addEventListener("click", async ()=>{
      try{
        await sb.auth.signOut();
      }finally{
        location.replace("./index.html");
      }
    });
  }
  document.getElementById("existingSessionEmail").textContent=email;
}

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(console.error));}
checkExistingSession();
</script>
</body></html>
